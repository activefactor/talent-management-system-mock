<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン - TalentHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-600 via-indigo-700 to-purple-800 flex items-center justify-center p-4"
      x-data="loginApp()" x-cloak>

  <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">

    <!-- ロゴ -->
    <div class="flex items-center gap-3 mb-2">
      <div class="bg-indigo-600 rounded-xl w-10 h-10 flex items-center justify-center flex-shrink-0">
        <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952
                   4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07
                   M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766
                   l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0
                   3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0
                   2.625 2.625 0 015.25 0z" />
        </svg>
      </div>
      <span class="text-2xl font-bold text-gray-900">TalentHub</span>
    </div>
    <p class="text-gray-500 text-sm mb-8">エンジニアのスキルと成長を可視化する社内システム</p>

    <!-- 入力フィールド -->
    <div class="space-y-4 mb-6">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">メールアドレス</label>
        <input type="email" x-model="email" placeholder="you@company.com"
               class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm
                      focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-shadow">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">パスワード</label>
        <input type="password" x-model="password" placeholder="••••••••"
               @keydown.enter="login()"
               class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm
                      focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-shadow">
      </div>
    </div>

    <!-- Microsoftログインボタン -->
    <button @click="login()" :disabled="isLoading"
            class="w-full flex items-center justify-center gap-3 border border-gray-200
                   rounded-lg py-3 px-4 hover:bg-gray-50 transition-colors font-medium
                   text-gray-700 disabled:opacity-60 disabled:cursor-not-allowed">
      <!-- Microsoft 4色ロゴ -->
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
        <rect x="1"    y="1"    width="8.5" height="8.5" fill="#F35325"/>
        <rect x="10.5" y="1"    width="8.5" height="8.5" fill="#81BC06"/>
        <rect x="1"    y="10.5" width="8.5" height="8.5" fill="#05A6F0"/>
        <rect x="10.5" y="10.5" width="8.5" height="8.5" fill="#FFBA08"/>
      </svg>
      <span x-text="isLoading ? '認証中...' : 'Microsoftアカウントでログイン'"></span>
      <!-- スピナー -->
      <svg x-show="isLoading" class="animate-spin w-4 h-4 text-gray-400"
           fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
      </svg>
    </button>

    <!-- デモ用ロール選択 -->
    <div class="mt-6 bg-amber-50 border border-amber-200 rounded-lg p-4">
      <p class="text-xs font-semibold text-amber-800 mb-3">🎭 デモ用: 確認するロールを選択</p>
      <div class="flex gap-5">
        <template x-for="opt in roleOptions" :key="opt.value">
          <label class="flex items-center gap-1.5 cursor-pointer text-sm text-gray-700 select-none">
            <input type="radio" :value="opt.value" x-model="selectedRole"
                   class="accent-indigo-600 w-4 h-4">
            <span x-text="opt.label"></span>
          </label>
        </template>
      </div>
      <p class="text-xs text-amber-600 mt-2">
        ※ 何を入力してもログイン可能。ロールによって表示できる画面が変わります。
      </p>
    </div>

    <!-- 注記 -->
    <p class="text-xs text-gray-400 text-center mt-6 leading-relaxed">
      社内エンジニア専用システムです。<br>
      社外からのアクセスは許可されていません。
    </p>
  </div>

  <script>
    function loginApp() {
      return {
        email: '',
        password: '',
        selectedRole: 'engineer',
        isLoading: false,
        roleOptions: [
          { value: 'admin',    label: '管理者' },
          { value: 'senior',   label: 'シニア' },
          { value: 'engineer', label: '一般' },
        ],

        login() {
          if (this.isLoading) return;
          this.isLoading = true;
          setTimeout(() => {
            TH.auth.login(this.selectedRole);
            window.location.href = 'dashboard.html';
          }, 800);
        },
      }
    }
  </script>
</body>
</html>
